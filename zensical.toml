[project]
site_name = "Second Brain User Manual"
docs_dir = "docs"
repo_url = "https://github.com/Xuenjing/Second-Brain---LIA-PROJECT"
repo_name = "Second Brain"

extra_css = [
    "stylesheets/extra.css",
]

nav = [
    { "Home" = "index.md" },
    { "Getting Started" = "getting-started.md" },
    { "Using Second Brain" = [
        { "Adding Knowledge" = "adding-knowledge.md" },
        { "Asking Questions" = "asking-questions.md" },
        { "Managing Knowledge" = "managing-knowledge.md" },
        { "AI Analysis" = "ai-analysis.md" },
    ] },
    { "Settings" = "settings.md" },
    { "Backup" = "backup.md" },
]

[project.theme]
features = [
    "navigation.sections",
    "navigation.expand",
    "navigation.path",
    "navigation.top",
    "toc.follow",
]

font.text = "Inter"
font.code = "JetBrains Mono"

palette.primary = "indigo"
palette.accent = "cyan"

logo = "images/logo4.png"
favicon = "images/logo_chat.png"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
admonition = {}
pymdownx.details = {}

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"